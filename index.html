  <div id="toolbar">
    <input type="file" class="FileUpload" id="svg-upload" type="image" />
    <input type="file" class="FileUpload" id="iodt-upload" type="text" />

    <button class="btn" id="iodt-upload-button" title="Upload JSON"><i class="fa-solid fa-file-lines"></i></button>
    <!-- <button class="btn" id="svg-upload-button"><i class="fa-solid fa-upload"></i></button> -->

    <button class="btn" id="iodt-download-button" title="Download JSON"><i class="fa-solid fa-download"></i></button>

      <div id="3dButtons">

            class="fa-regular fa-square-plus"></i></i></button>
        <button class="btn3D" id="move-up-button" title="Move plane up"><i class="fa-solid fa-arrow-up"></i></button>
        <button class="btn3D" id="move-down-button" title="Move plane down"><i
            class="fa-solid fa-arrow-down"></i></button>
        <button class="btn3D" id="capture-slice-button" title="Capture slice"><i
            class="fa-regular fa-camera"></i></button>

      </div>

      <div id="rendercanvas"></div>
      <div id="canvas-wrap">
        <canvas id="svgCanvas"></canvas>
        <!-- <canvas id="colorMapCanvas"></canvas> -->
        <div id="colorLayerMaps"></div>
      </div>
    </div>
    <div id="rightContent">
      <div id="editorButtons"></div>
      <div id="jsoneditor">
        <JSONEditor bind:content />
      </div>
      <canvas id="dGraphCanvas"></canvas>
    </div>
